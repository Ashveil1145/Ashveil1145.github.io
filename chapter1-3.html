
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chapter 1 - Let's Date, Senpai</title>

<style>

/* =========================
   Basic Settings
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: black;
    font-family: 'Quicksand', sans-serif;
    color: white;
}

/* Background */

.background {
    position: fixed;
    width: 100%;
    height: 100vh;

    background-image: url("bg2.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -1;
}

/* Story Layout */

.story-screen {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    padding: 30px;
}

/* Dialogue Box */

.dialogue-box {
    width: 100%;
    min-height: 190px;

    background-color: rgba(100, 100, 100, 0.75);

    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 8px;

    padding: 25px 35px;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.speaker {
    color: #eeeeee;
    font-size: 16px;
    font-weight: bold;
}

.english {
    color: white;
    font-size: 21px;
    line-height: 1.5;
}

.chinese {
    color: #dddddd;
    font-size: 14px;
    line-height: 1.5;
}

/* Continue Button */

.button-area {
    display: none;
    justify-content: flex-end;
    margin-top: 8px;
}

.next-button {
    padding: 10px 25px;

    color: white;
    background-color: #555555;

    border: 1px solid #dddddd;
    border-radius: 5px;

    font-size: 15px;
    cursor: pointer;

    transition: 0.3s;
}

.next-button:hover {
    background-color: white;
    color: black;
}


/* =========================
   Mini Game Style
========================= */

/* 游戏背景 */

.game-screen {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;

    background-color: rgba(0, 0, 0, 0.75);

    display: none;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

/* 游戏窗口 */

.game-box {
    width: 85%;
    max-width: 750px;

    padding: 30px;

    background-color: rgba(50, 50, 50, 0.95);

    border: 1px solid white;
    border-radius: 12px;

    text-align: center;
}

.game-title {
    font-size: 30px;
    margin-bottom: 12px;
}

.game-instruction {
    font-size: 16px;
    color: #dddddd;
    margin-bottom: 15px;
}

.score {
    font-size: 20px;
    margin-bottom: 15px;
}

/* 游戏区域 */

.game-area {
    position: relative;

    width: 100%;
    height: 280px;

    background-color: rgba(255, 255, 255, 0.12);

    border: 1px solid #aaaaaa;
    border-radius: 8px;

    overflow: hidden;
}

/* 星星按钮 */

.star-button {
    position: absolute;

    width: 55px;
    height: 55px;

    font-size: 35px;

    background: none;
    border: none;

    cursor: pointer;

    transition: 0.15s;
}

.star-button:hover {
    transform: scale(1.2);
}

/* 游戏完成文字 */

.game-result {
    display: none;

    font-size: 20px;
    margin-top: 20px;
    color: white;
}

/* 游戏完成后的按钮 */

.game-continue {
    display: none;

    margin: 15px auto 0;
    padding: 12px 30px;

    background-color: white;
    color: black;

    border: none;
    border-radius: 6px;

    font-size: 16px;
    cursor: pointer;
}

.game-continue:hover {
    background-color: #dddddd;
}

</style>
</head>

<body>

<!-- Background -->

<div class="background"></div>


<!-- Story Page -->

<div class="story-screen">

    <div class="dialogue-box">

        <p class="speaker" id="speaker">奶蛙</p>

        <p class="english" id="english"></p>

        <p class="chinese" id="chinese"></p>

        <div class="button-area" id="button-area">

            <button class="next-button"
            id="next-button"
            onclick="nextText()">

                Continue / 继续

            </button>

        </div>

    </div>

</div>


<!-- Mini Game Screen -->

<div class="game-screen" id="game-screen">

    <div class="game-box">

        <h1 class="game-title">Encouragement from Naiwa</h1>

        <p class="game-instruction">
            点击得到鼓励
        </p>

        <!-- 显示分数 -->

        <p class="score" id="score">
            Score: 0 / 5
        </p>

        <!-- 游戏区域 -->

        <div class="game-area" id="game-area">

            <button class="star-button"
            id="star-button"
            onclick="catchStar()">

                ⭐

            </button>

        </div>

        <!-- 游戏完成提示 -->

        <p class="game-result" id="game-result">
            You have the chance to walk home from school with Naiwa!
        </p>

        <!-- 进入下一页 -->

        <button class="game-continue"
        id="game-continue"
        onclick="goNextPage()">

            Continue / 继续

        </button>

    </div>

</div>


<script>

/* =========================
   Story Settings
========================= */

let page = 1;

let speed = 60;

let englishText = "";
let chineseText = "";


/* =========================
   Typing Effect
========================= */

function typeText() {

    let englishIndex = 0;
    let chineseIndex = 0;

    document.getElementById("english").innerHTML = "";
    document.getElementById("chinese").innerHTML = "";

    document.getElementById("button-area").style.display = "none";

    let englishTimer = setInterval(function() {

        document.getElementById("english").innerHTML +=
        englishText.charAt(englishIndex);

        englishIndex++;

        if (englishIndex >= englishText.length) {

            clearInterval(englishTimer);

            let chineseTimer = setInterval(function() {

                document.getElementById("chinese").innerHTML +=
                chineseText.charAt(chineseIndex);

                chineseIndex++;

                if (chineseIndex >= chineseText.length) {

                    clearInterval(chineseTimer);

                    document.getElementById("button-area").style.display = "flex";

                }

            }, speed);

        }

    }, speed);

}


/* =========================
   Story Progress
========================= */

function nextText() {

    if (page == 1) {

        document.getElementById("speaker").innerHTML = "Y/N";

        englishText = "Th... thank you.";
        chineseText = "谢……谢谢。";

        page = 2;

        typeText();

    } else if (page == 2) {

        // 第二段对话结束后，进入小游戏
        showGame();

    }

}


/* =========================
   Mini Game
========================= */

// 游戏分数

let score = 0;


// 显示小游戏

function showGame() {

    document.querySelector(".story-screen").style.display = "none";

    document.getElementById("game-screen").style.display = "flex";

    moveStar();

}


// 随机移动星星

function moveStar() {

    let area = document.getElementById("game-area");

    let star = document.getElementById("star-button");

    // 计算星星可以移动的范围

    let maxX = area.clientWidth - star.offsetWidth;
    let maxY = area.clientHeight - star.offsetHeight;

    // 生成随机位置

    let randomX = Math.floor(Math.random() * maxX);
    let randomY = Math.floor(Math.random() * maxY);

    // 把星星移动到新位置

    star.style.left = randomX + "px";
    star.style.top = randomY + "px";

}


// 点击星星

function catchStar() {

    score++;

    // 更新分数

    document.getElementById("score").innerHTML =
    "Score: " + score + " / 5";


    // 检查是否达到目标

    if (score >= 5) {

        // 隐藏星星

        document.getElementById("star-button").style.display = "none";

        // 显示完成提示

        document.getElementById("game-result").style.display = "block";

        // 显示继续按钮

        document.getElementById("game-continue").style.display = "block";

    } else {

        // 没有完成时，让星星换一个随机位置

        moveStar();

    }

}


// 进入下一页

function goNextPage() {

    window.location.href = "chapter1-4.html";

}


/* =========================
   First Dialogue
========================= */

englishText = "You don't seem very happy. It's okay. Keep going, senpai!";

chineseText = "你好像不太开心，没事的，加油啊前辈！";

typeText();

</script>

</body>
</html>
